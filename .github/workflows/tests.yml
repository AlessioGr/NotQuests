name: Tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  checks: write       # allow the test reporter to publish check annotations

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run build and tests
        run: ./gradlew build --stacktrace

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6.5.0
        if: ${{ !cancelled() }}        # run even if tests failed, so failures are annotated
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
          detailed_summary: true

      - name: Upload HTML test reports
        uses: actions/upload-artifact@v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: '**/build/reports/tests/test/'
          if-no-files-found: ignore
