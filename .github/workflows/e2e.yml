name: E2E command sweep

# Boots real Paper and NeoForge servers with freshly built artifacts and runs the same core-owned
# command list through each console. Fails on parser/handler errors, exceptions, or a newly added
# objective/action/condition/trigger type that ships without a test command. Console-driven only
# (no Minecraft client) — see e2e/README.md.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run Paper server-side command sweep
        run: ./e2e/run-sweep.sh

      - name: Run NeoForge server-side command sweep
        run: ./e2e/run-neoforge-sweep.sh

      - name: Compare Paper and NeoForge command/registry metadata
        run: ./src/core/e2e/compare-platform-metadata.py

      - name: Run BetonQuest 3 server-side command sweep
        run: ./e2e/run-betonquest-sweep.sh

      - name: Upload server log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-server-logs
          path: |
            /tmp/nq-e2e-paper-server.log
            /tmp/nq-e2e-neoforge-server.log
            /tmp/nq-betonquest-server.log
          if-no-files-found: ignore
